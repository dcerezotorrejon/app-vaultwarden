---
name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/dcerezotorrejon/bitwarden
  BUILD_FROM: ghcr.io/hassio-addons/base:21.0.1

jobs:
  # Renovate merges a pin bump on its own, and that push lands here before
  # stamp.yaml has raised the add-on version. Publishing at that moment would
  # push a different Vaultwarden under a tag that already exists. Wait for the
  # stamp instead — it dispatches this workflow once the two agree.
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read add-on version
        id: addon
        run: |
          version=$(yq -r '.version' vaultwarden/config.yaml)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: vaultwarden
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_FROM=${{ env.BUILD_FROM }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            BUILD_DESCRIPTION=Open source password management solution
            BUILD_NAME=Vaultwarden
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_VERSION=${{ steps.addon.outputs.version }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.addon.outputs.version }}
          push: true