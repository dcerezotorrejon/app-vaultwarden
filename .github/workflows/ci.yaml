---
# Build check for pull requests.
#
# This is what makes Renovate's automerge safe: with no test to wait on it
# merges immediately, which is how a broken build reaches main. Upstream had
# the same gate via hassio-addons/workflows; that reusable workflow cannot run
# from a fork, so the build is spelled out here instead.
#
# It builds what deploy.yaml builds, for both architectures, and throws the
# result away. Renovate holds a PR until this passes.
name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build add-on image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read add-on version
        id: addon
        run: |
          version=$(sed -n 's|^version: \(.*\)$|\1|p' vaultwarden/config.yaml)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: vaultwarden
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_FROM=ghcr.io/hassio-addons/debian-base:9.3.0
            BUILD_DATE=${{ github.event.repository.updated_at }}
            BUILD_DESCRIPTION=Open source password management solution
            BUILD_NAME=Vaultwarden
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_VERSION=${{ steps.addon.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: false